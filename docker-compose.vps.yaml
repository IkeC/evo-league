services:

  # ─────────────────────────────────────────────────────────────────────────────
  #  MySQL 5.7  (base de datos del juego)
  #
  #  Aislado: NO publica ningún puerto al host. Solo es accesible dentro de la red
  #  evo_net, por el nombre "db". Cero conflicto con el MySQL 8 del VPS.
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: evo_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: CAMBIA_ESTE_ROOT_PASS
      MYSQL_DATABASE: pes6
      MYSQL_USER: pes6
      MYSQL_PASSWORD: LATAMeSportsPES6
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - evo_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pCAMBIA_ESTE_ROOT_PASS"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────────
  #  phpMyAdmin  (administración de la BD)
  #
  #  Ve la BD por la red interna (PMA_HOST=db) y expone su web en 127.0.0.1:8082
  #  → exponer por Reverse Proxy de CloudPanel o túnel SSH. No abrir a internet.
  # ─────────────────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    platform: linux/amd64
    container_name: evo_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evo_net

  # ─────────────────────────────────────────────────────────────────────────────
  #  Aplicación web PHP 5.5 + Cron
  #
  #  En evo_net → llega a la BD como host "db". Apache expuesto en 127.0.0.1:8081
  #  para el Reverse Proxy de CloudPanel (igual que antes).
  # ─────────────────────────────────────────────────────────────────────────────
  web:
    platform: linux/amd64
    build:
      context: /home/bucketcode-pes6/evo-league-master/evo-league-master/docker
      dockerfile: Dockerfile.web
    container_name: evo_web
    restart: unless-stopped
    environment:
      APACHE_PORT: 8081
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /home/bucketcode-pes6/htdocs/pes6.bucketcode.net:/var/www/html
      - /home/bucketcode-pes6/evo-league-master/evo-league-master/cron:/var/www/cron
      - cron_logs:/var/log/cron-evo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evo_net

  # ─────────────────────────────────────────────────────────────────────────────
  #  Sixserver — servidor online PES 6
  #
  #  En evo_net → llega a la BD como host "db". Expone los puertos del juego a la
  #  calle. ServerIP (107.152.41.33) se anuncia igual desde sixserver.yaml.
  # ─────────────────────────────────────────────────────────────────────────────
  sixserver:
    build:
      context: /home/bucketcode-pes6/evo-league-master/evo-league-master/Sixserver
      dockerfile: Dockerfile
    container_name: evo_sixserver
    restart: unless-stopped
    ports:
      - "10881:10881/tcp"   # puerto de juego PES6
      - "20200:20200/tcp"   # mainService
      - "20201:20201/tcp"   # networkMenuService
      - "20202:20202/tcp"   # loginService PES6
      - "20203:20203/tcp"   # loginService WE2007
    volumes:
      - sixserver_logs:/var/log/sixserver
      - /home/bucketcode-pes6/evo-league-master/evo-league-master/Sixserver/etc/conf:/opt/sixserver/etc/conf
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evo_net

# ─────────────────────────────────────────────────────────────────────────────
#  Volúmenes y redes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  db_data:
  sixserver_logs:
  cron_logs:

networks:
  evo_net:
    driver: bridge
